name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: clawd-linux-x86_64
          - os: macos-latest
            artifact_name: clawd-macos-arm64
          - os: macos-13
            artifact_name: clawd-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name clawd \
            --add-data "claude_usage/styles/app.tcss:claude_usage/styles" \
            run.py

      - name: Rename binary
        run: mv dist/clawd dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "clawd ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/clawd-linux-x86_64
            dist/clawd-macos-arm64
            dist/clawd-macos-x86_64
