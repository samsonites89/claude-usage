name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_created: ${{ steps.tag_check.outputs.tag_created }}
      notes: ${{ steps.changelog.outputs.notes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.version }}" | grep -q .; then
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog entry
        if: steps.tag_check.outputs.tag_created == 'true'
        id: changelog
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import re, pathlib

          version = "${{ steps.version.outputs.version }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()

          pattern = rf"(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          entry = match.group(1).strip() if match else f"Release {version}"

          print("notes<<EOF_NOTES")
          print(entry)
          print("EOF_NOTES")
          PYEOF

      - name: Create and push tag
        if: steps.tag_check.outputs.tag_created == 'true'
        env:
          TAG_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf '%s' "$TAG_NOTES" > /tmp/tag_message.txt
          git tag -a "${{ steps.version.outputs.version }}" -F /tmp/tag_message.txt
          git push origin "${{ steps.version.outputs.version }}"

  build:
    name: Build (${{ matrix.artifact_name }})
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: clawd-linux-x86_64
          - os: macos-latest
            artifact_name: clawd-macos-arm64
          - os: macos-13
            artifact_name: clawd-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name clawd \
            --add-data "claude_usage/styles/app.tcss:claude_usage/styles" \
            run.py

      - name: Rename binary
        run: mv dist/clawd dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish:
    name: Publish release
    needs: [tag, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          name: "clawd ${{ needs.tag.outputs.version }}"
          body: ${{ needs.tag.outputs.notes }}
          files: |
            dist/clawd-linux-x86_64
            dist/clawd-macos-arm64
            dist/clawd-macos-x86_64
