[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage"
version = "1.2.0"
description = "Terminal dashboard for Claude Code token usage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
claude-usage = "claude_usage.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_usage*"]

[tool.setuptools.package-data]
claude_usage = ["styles/*.tcss"]
